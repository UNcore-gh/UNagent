# Attest release assets with GitHub Artifact Attestations.
#
# Why: lets users cryptographically verify that the published
# main.js / styles.css / manifest.json really came from this repository
# (UNcore-gh/UNagent) and were not tampered with:
#     gh attestation verify main.js -o UNcore-gh
#
# Triggers:
#   - push of any tag (the normal release path: every new version gets
#     attested automatically)
#   - manual workflow_dispatch (e.g. to backfill attestations for an
#     already-published release)
#
# Assets are built locally and committed, so this workflow simply
# checks out the tagged files and attests their digests — no rebuild
# needed. Its purpose is the verification path above: users and auditors can
# prove that a published asset came from this repository.
#
# (An earlier version of this comment claimed Obsidian's marketplace review
# requires these attestations. That claim could not be confirmed against
# Obsidian's submission docs, so it was removed 2026-09-13 — do not restate it
# as fact without a source.)
name: Attest Release Assets

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release files
        uses: actions/checkout@v4

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json