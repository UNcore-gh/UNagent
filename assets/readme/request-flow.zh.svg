<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">UNagent 示意流程：从提出需求到回答或文件操作</title>
  <desc id="desc">示意流程：你提出需求，由自己配置的模型回答，或按需请求工具。UNagent 工具只在任务需要时读取相关笔记或执行文件操作。结果可能是回答，也可能是文件改动；具体复核方式取决于操作与审批模式。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3478d4"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="790" rx="26" fill="#f7f8fa"/>
  <text x="64" y="54" fill="#596575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="34" font-weight="650">示意流程</text>
  <text x="64" y="106" fill="#202833" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="680">从提出需求到获得结果</text>

  <g id="request">
    <rect x="64" y="140" width="1072" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M92 168h50a12 12 0 0 1 12 12v24a12 12 0 0 1-12 12h-19l-15 12v-12h-16a12 12 0 0 1-12-12v-24a12 12 0 0 1 12-12z" fill="#eaf2ff" stroke="#3478d4" stroke-width="2.5"/>
    <text x="178" y="190" fill="#202833" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="48" font-weight="650">你提出请求</text>
    <text x="178" y="224" fill="#435064" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36">“总结我关于读书的笔记”</text>
    <rect x="824" y="160" width="270" height="42" rx="12" fill="#eaf2ff" stroke="#8db5eb" stroke-width="1.5"/>
    <text x="842" y="190" fill="#174b8e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="650">@ 读书笔记</text>
  </g>

  <path d="M600 250v26" fill="none" stroke="#3478d4" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <g id="model">
    <rect x="64" y="286" width="1072" height="118" rx="18" fill="#eaf2ff" stroke="#8db5eb" stroke-width="2"/>
    <rect x="94" y="316" width="56" height="56" rx="16" fill="#ffffff" stroke="#3478d4" stroke-width="2"/>
    <path d="M110 334h24M110 344h24M110 354h17" fill="none" stroke="#3478d4" stroke-width="3" stroke-linecap="round"/>
    <text x="178" y="338" fill="#202833" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="48" font-weight="650">你配置的模型</text>
    <text x="178" y="376" fill="#435064" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36">直接回答，或按需请求笔记工具</text>
  </g>

  <path d="M600 406v26" fill="none" stroke="#3478d4" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <g id="tool-row">
    <rect x="64" y="442" width="490" height="142" rx="18" fill="#ffffff" stroke="#b8c6d8" stroke-width="2"/>
    <rect x="646" y="442" width="490" height="142" rx="18" fill="#ffffff" stroke="#b8c6d8" stroke-width="2"/>

    <path d="M96 472h36l12 12v52H96z" fill="#f7f8fa" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M132 472v13h12M105 500h27M105 510h27M105 520h18" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="517" fill="#202833" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="48" font-weight="650">UNagent 工具</text>

    <path d="M674 472h36l12 12v52h-48z" fill="#f7f8fa" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M710 472v13h12M683 500h27M683 510h27M683 520h18" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="744" y="517" fill="#202833" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="48" font-weight="650">你的 vault</text>

    <path d="M554 478H646" fill="none" stroke="#3478d4" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
    <path d="M646 548H554" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow-muted)"/>
  </g>

  <path d="M600 586v22H309v19" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M600 608h291v19" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>

  <g id="outcomes">
    <rect x="64" y="636" width="490" height="112" rx="18" fill="#edf7f1" stroke="#93c8a7" stroke-width="2"/>
    <circle cx="108" cy="692" r="20" fill="#ffffff" stroke="#247a4b" stroke-width="3"/>
    <path d="M98 692l7 7 14-16" fill="none" stroke="#247a4b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="704" fill="#174a31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="680">回答或总结</text>

    <rect x="646" y="636" width="490" height="112" rx="18" fill="#fff5e9" stroke="#e8bd87" stroke-width="2"/>
    <path d="M680 672h38v42h-38zM688 682h22M688 692h22M688 702h14" fill="#ffffff" stroke="#a45b12" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="736" y="704" fill="#71400d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="680">请求的文件改动</text>
  </g>
</svg>
